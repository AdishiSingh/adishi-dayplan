databases:
  - name: dayplan-db
    databaseName: dayplan
    user: dayplan_user
    plan: free

services:
  - type: web
    name: adishi-dayplan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dayplan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.7

